services:
  radio:
    image: ai-project-radio:dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: docker/Dockerfile.radio
    volumes:
      - .:/project
    command: ["python", "app/builder.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${RADIO_PORT:-8010}:8000"
  husky:
    image: ai-project-husky:dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: docker/Dockerfile.husky
    volumes:
      - .:/project
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      - QT_QPA_PLATFORM=offscreen
      - GZ_HOMEDIR=/tmp/gazebo-user
      - ROS_LOG_DIR=/tmp/ros-log
    depends_on:
      - radio
    command: ["bash", "/project/scripts/start_husky.sh"]
